# ============================================================================
# b6p-cli Release Binaries
# ============================================================================
# Purpose: When a GitHub Release is published for a version tag, build the
#          standalone, Node-bundling `b6p` binary for each target platform and
#          attach it (plus a .sha256 sidecar) to that Release.
#
#          Publishing a Release is the admin act that APPROVES a version;
#          deleting/yanking the Release pulls the binaries. npm publishing is
#          independent and lives in publish.yml (tag-triggered) — this workflow
#          does NOT touch it.
#
# Pre-release lines: a binary line listed in PRERELEASE_LINES below is marked
#          "pre-release" on its Release BEFORE any binary is attached, so
#          `releases/latest/download/<asset>` keeps serving the previous stable
#          binary. Promote a line by removing it from the list and running
#          `gh release edit <tag> --prerelease=false --latest`. (An admin can also
#          tick "Set as a pre-release" when publishing; this job is the backstop.)
#          Why 0.9 is listed: docs/adr/0003-server-side-compile.md.
#
# Toolchain: Node SEA + postject. SEA cannot cross-compile, so each OS/arch is
#            built on its own runner. See docs/adr/0001-standalone-binary-toolchain.md
#            and scripts/build-sea.mjs.
# ============================================================================

name: Release Binaries

on:
  release:
    types: [published]

# Least privilege: uploading Release assets needs write access to repo contents.
permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false # Never cancel an in-flight asset upload.

env:
  # Space-separated MAJOR.MINOR lines whose standalone binaries ship as a pre-release.
  # 0.9 needs a server with server-side compile; remove it once every namespace is on the floor tag.
  PRERELEASE_LINES: '0.9'

jobs:
  classify:
    name: Mark pre-release lines
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mark the Release pre-release when its line is listed
        run: |
          set -euo pipefail
          LINE="$(echo "${TAG#v}" | cut -d. -f1,2)"
          for listed in $PRERELEASE_LINES; do
            if [ "$listed" = "$LINE" ]; then
              gh release edit "$TAG" --prerelease
              echo "::notice::$TAG is on pre-release line $LINE: marked pre-release"
              exit 0
            fi
          done
          echo "::notice::$TAG (line $LINE) is not a pre-release line"

  build:
    name: Build ${{ matrix.asset }}
    needs: classify
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # One platform failing must not abort the others.
      matrix:
        include:
          - os: windows-latest # x64
            asset: b6p-windows-x64.exe
          - os: macos-15-intel # Intel
            asset: b6p-macos-x64
          - os: macos-14 # Apple Silicon
            asset: b6p-macos-arm64

    defaults:
      run:
        shell: bash # Uniform shell across Windows/macOS runners.

    env:
      TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0
            echo "Attempt $i failed."
            [ "$i" -lt 3 ] && sleep 5
          done
          echo "::error::npm ci failed after 3 attempts"
          exit 1

      # Guard against attaching a binary to a tag whose version doesn't match
      # package.json (mirrors publish.yml's check).
      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${TAG#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "::notice::Building $asset for version $PKG_VERSION"
        env:
          asset: ${{ matrix.asset }}

      # Builds dist/cli.js, injects it into a copy of the host Node runtime via
      # SEA + postject, writes <asset>.sha256, and smoke-tests the binary. A
      # smoke-test failure fails the job here, so a broken binary is never
      # uploaded.
      - name: Build standalone binary
        run: npm run build:sea

      - name: Upload binary to release
        run: gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          asset: ${{ matrix.asset }}
